# 빌드 도구는 패키징에만 사용하며, 실행 시 필요한 외부 의존성은 아직 없다.
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

# 프로젝트의 기본 메타데이터와 지원할 Python 버전을 정의한다.
[project]
name = "retail-demand-mlops"
version = "0.1.0"
description = "End-to-end retail demand data and MLOps pipeline"
requires-python = ">=3.11"
dependencies = [
    # XLSX 원본을 전체 메모리에 올리지 않고 읽기 위해 필요한 최소 의존성이다.
    "openpyxl>=3.1,<4",
    # PostgreSQL의 COPY 프로토콜로 대용량 CSV를 효율적으로 적재한다.
    "psycopg[binary]>=3.2,<4",
]

# 긴 모듈 경로를 외우지 않아도 기존 main 함수를 실행하도록 CLI 진입점을 제공한다.
[project.scripts]
retail-download = "retail_demand_mlops.ingestion.download:main"
retail-profile = "retail_demand_mlops.ingestion.profile:main"
retail-transform = "retail_demand_mlops.ingestion.transform:main"
retail-db-setup = "retail_demand_mlops.database.setup:main"
retail-load = "retail_demand_mlops.ingestion.loader:main"
retail-validate = "retail_demand_mlops.ingestion.validate:main"
retail-daily = "retail_demand_mlops.ingestion.daily_pipeline:main"

# src 디렉터리 아래의 Python 패키지만 자동으로 탐색한다.
[tool.setuptools.packages.find]
where = ["src"]
